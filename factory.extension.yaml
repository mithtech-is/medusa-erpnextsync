schemaVersion: 1
id: erpnext
kind: plugin
title: ERPNext catalogue sync
summary: Products kept in step with an ERPNext site over Frappe core Webhooks and a scheduled pull; ERPNext is source of truth. Nothing is installed on ERPNext. Pushes to ERPNext are paused in this release.
provides: [erp-sync, erp-catalogue-pull]
requires: []
optional: []
conflictsWith: []
exclusiveGroup: erp
medusaRange: "^2.19.0"
installPhase: integration
config:
  target: plugins
  options: {}
env:
  - { key: ERPNEXT_URL, hint: "fallback; primary config is the admin ERPNext settings page" }
  - { key: ERPNEXT_API_KEY, hint: "Frappe API user; System Manager for Set up ERPNext" }
  - { key: ERPNEXT_API_SECRET }
  - { key: ERPNEXT_FRAPPE_WEBHOOK_SECRET, hint: "fallback for the Frappe webhook secret; Set up ERPNext generates and stores one" }
  - { key: MEDUSA_BACKEND_URL, hint: "fallback for the Medusa public URL the Webhooks POST to" }
  - { key: INVENTORY_LOCATION_ID }
storefront: none
verify:
  - { http: "GET /admin/erpnext/settings", expect: 401 }
brokenExports: []
